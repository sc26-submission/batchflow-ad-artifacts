name: imagenet_4j_mixed
dataset: imagenet
results_dir: exp_results

job_defaults:
  num_steps: 100
  warmup_steps: 5
  learning_rate: 0.001
  device: cpu
  use_amp: true

jobs:
  - name: resnet18
    model_name: resnet18

  - name: resnet50
    model_name: resnet50

  - name: mobilenet_v3_small
    model_name: mobilenet_v3_small

  - name: vgg16
    model_name: vgg16
