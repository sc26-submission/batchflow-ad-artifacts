name: coco_4j_albef
dataset: coco
results_dir: exp_results

job_defaults:
  task: retrieval
  num_batches: 100
  warmup_batches: 5
  learning_rate: 0.00001
  weight_decay: 0.02
  alpha: 0.4
  device: cuda
  use_amp: true

jobs:
  - name: albef_vision_2
    model_name: albef_vision_2

  - name: albef_vision_4
    model_name: albef_vision_4

  - name: albef_vision_8
    model_name: albef_vision_8

  - name: albef_vision_16
    model_name: albef_vision_16
