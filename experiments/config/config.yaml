defaults:
  - _self_
  - system: tensorsocket #pytorch, coordl, batchflow, tensorsocket
  - workload: cifar10_4j_mixed #cifar10_1j_resnet18, imagenet_1j_resnet18
  - ablation: none
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  run:
    dir: .
  sweep:
    dir: .
  output_subdir: null
  job_logging:
    level: DISABLE
  hydra_logging:
    level: DISABLE
