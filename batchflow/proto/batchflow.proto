syntax = "proto3";

package batchflow.v1;

service CoordinatorService {
  rpc RegisterDataset(RegisterDatasetRequest) returns (RegisterDatasetResponse);

  rpc StartJob(StartJobRequest) returns (StartJobResponse);
  rpc GetNextBatch(GetNextBatchRequest) returns (GetNextBatchResponse);
  // Legacy wire name: Python APIs call this acknowledge_batch.
  rpc CommitBatch(CommitBatchRequest) returns (CommitBatchResponse);
  rpc FinishJob(FinishJobRequest) returns (FinishJobResponse);

  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc HeartbeatWorker(HeartbeatWorkerRequest) returns (HeartbeatWorkerResponse);

  rpc PollMaterializeBatchTask(PollMaterializeBatchTaskRequest) returns (PollMaterializeBatchTaskResponse);
  rpc CompleteMaterializeBatchTask(CompleteMaterializeBatchTaskRequest) returns (CompleteMaterializeBatchTaskResponse);
  rpc FailMaterializeBatchTask(FailMaterializeBatchTaskRequest) returns (FailMaterializeBatchTaskResponse);
}

service WorkerDataService {
  rpc FetchBatch(FetchBatchRequest) returns (FetchBatchResponse);
}

message KeyValue {
  string key = 1;
  string value = 2;
}

enum StorageClass {
  STORAGE_CLASS_UNSPECIFIED = 0;
  STORAGE_CLASS_REUSABLE = 1;
  STORAGE_CLASS_TRANSIENT = 2;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_ACTIVE = 1;
  JOB_STATUS_COMPLETED = 2;
  JOB_STATUS_CANCELLED = 3;
  JOB_STATUS_FAILED = 4;
}

enum BatchHandleStatus {
  BATCH_HANDLE_STATUS_UNSPECIFIED = 0;
  BATCH_HANDLE_STATUS_PENDING = 1;
  BATCH_HANDLE_STATUS_READY = 2;
  BATCH_HANDLE_STATUS_FAILED = 3;
}

message Sample {
  string sample_id = 1;
  string source_uri = 2;
  int64 label = 3;
  string class_name = 4;
  string transform_name = 5;
  bool has_label = 6;
}

message Dataset {
  string dataset_id = 1;
  repeated Sample samples = 2;
  int32 batch_size = 3;

  bool drop_last = 4;
  bool shuffle = 5;
  int64 seed = 6;

  string transform_name = 7;
  repeated KeyValue metadata = 8;

  string payload_format = 9;
  string dataset_format = 10;
}

message RegisterDatasetRequest {
  Dataset dataset = 1;
}

message RegisterDatasetResponse {
  string dataset_id = 1;
  int64 sample_count = 2;
  int32 batch_size = 3;
}

message StartJobRequest {
  string job_id = 1;
  string dataset_id = 2;
  int32 lookahead_batches = 3;
  repeated KeyValue metadata = 4;
}

message StartJobResponse {
  string job_id = 1;
  int32 epoch = 2;
  int32 next_batch_index = 3;
}

message TrainerRuntimeFeedback {
  double data_bottleneck_percent = 1;
  double avg_data_time_sec = 2;
  double avg_compute_time_sec = 3;
  double avg_coordinator_wait_total_time_sec = 4;
  double avg_coordinator_pending_polls = 5;
}

message GetNextBatchRequest {
  string job_id = 1;
  TrainerRuntimeFeedback runtime_feedback = 2;
}

message BatchHandle {
  string batch_id = 1;
  string cache_key = 2;
  BatchHandleStatus status = 3;

  string fetch_host = 4;
  int32 fetch_port = 5;
  string fetch_key = 6;

  string payload_format = 7;
  string dataset_format = 8;

  string location = 9;
  int64 expires_at_ms = 10;

  repeated KeyValue metadata = 11;
}

message GetNextBatchResponse {
  BatchHandle batch_handle = 1;
  int32 epoch = 2;
  int32 batch_index = 3;
  bool has_batch_index = 4;
  bool done = 5;
  repeated KeyValue metadata = 6;
}

message CommitBatchRequest {
  string job_id = 1;
  string batch_id = 2;
  int32 epoch = 3;
  int32 batch_index = 4;
}

message CommitBatchResponse {
  string job_id = 1;
  int32 epoch = 2;
  int32 next_batch_index = 3;
  int32 last_batch_index = 4;
  string last_batch_id = 5;
}

message FinishJobRequest {
  string job_id = 1;
  string reason = 2;
  JobStatus status = 3;
}

message FinishJobResponse {
  string job_id = 1;
  JobStatus status = 2;
  string reason = 3;
}

message RegisterWorkerRequest {
  string worker_id = 1;
  string hostname = 2;
  repeated KeyValue metadata = 3;
}

message RegisterWorkerResponse {
  string worker_id = 1;
}

message HeartbeatWorkerRequest {
  string worker_id = 1;
}

message HeartbeatWorkerResponse {
  string worker_id = 1;
  int64 last_heartbeat_at_ms = 2;
}

message Batch {
  string batch_id = 1;
  string dataset_id = 2;
  int32 epoch = 3;
  int32 batch_index = 4;
  int32 batch_size = 5;
  repeated Sample samples = 6;
  int64 planned_at_ms = 7;
  string transform_name = 8;
  repeated KeyValue metadata = 9;
}

message MaterializeBatchTask {
  string task_id = 1;
  Batch batch = 2;
  string job_id = 3;
  double priority = 4;
  StorageClass storage_class = 5;
  int64 created_at_ms = 6;
  int64 not_before_ms = 7;
  repeated KeyValue metadata = 8;

  string payload_format = 9;
  string dataset_format = 10;
}

message PollMaterializeBatchTaskRequest {
  string worker_id = 1;
}

message PollMaterializeBatchTaskResponse {
  bool has_task = 1;
  MaterializeBatchTask task = 2;
}

message CompleteMaterializeBatchTaskRequest {
  string task_id = 1;
  string worker_id = 2;
  string location = 3;
  int64 size_bytes = 4;
  StorageClass storage_class = 5;
  int64 expires_at_ms = 6;
  repeated KeyValue metadata = 7;
}

message CompleteMaterializeBatchTaskResponse {
  string task_id = 1;
  string batch_id = 2;
}

message FailMaterializeBatchTaskRequest {
  string task_id = 1;
  string worker_id = 2;
  string reason = 3;
}

message FailMaterializeBatchTaskResponse {
  string task_id = 1;
  string reason = 2;
}

message FetchBatchRequest {
  string key = 1;
}

message FetchBatchResponse {
  string key = 1;
  bytes payload = 2;
}