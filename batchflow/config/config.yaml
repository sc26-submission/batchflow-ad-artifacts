defaults:
  - _self_
  - dataset: cifar10
  - topology: local
  - policy: full
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# Which node in the selected topology this process should launch.
node_id: local

logging:
  dir: batchflow/logs
  level: INFO

hydra:
  run:
    dir: .
  sweep:
    dir: .
  output_subdir: null
  job_logging:
    level: DISABLE
  hydra_logging:
    level: DISABLE